name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Install cross-compilation targets
        run: rustup target add x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Pinned: 0.23.4 rewrites rustc's `-Wl,<path>` arguments to bare positional
      # paths, which breaks the `-Wl,-exported_symbols_list -Wl,<path>` pair rustc
      # emits for cdylibs on Apple targets (htmlentity is cdylib+rlib), and the
      # link fails with `unable to read exported symbols list '-dead_strip'`.
      # See https://github.com/rust-cross/cargo-zigbuild/pull/477.
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.3 --locked

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  publish-crates:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --token ${{ steps.crates-io-auth.outputs.token }}
