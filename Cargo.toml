[package]
name = "mdriver"
version = "1.2.0"
edition = "2021"
description = "Streaming markdown printer for the terminal with syntax highlighting"
license = "MIT"
repository = "https://github.com/llimllib/mdriver"
readme = "README.md"
keywords = ["markdown", "terminal", "cli", "streaming", "syntax-highlighting"]
categories = ["command-line-utilities", "text-processing"]
authors = ["Bill Mill <bill@billmill.org>"]
exclude = ["mdriver-*"]

[[bin]]
name = "mdriver"
path = "src/main.rs"

[dependencies]
two-face = "0.5.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "parsing", "html", "dump-load", "dump-create"] }
ureq = "3.3.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.23.0"
term_size = "0.3.2"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
unicode-width = "0.2.2"
htmlentity = "1.3.2"
merman = { version = "0.8.0-alpha.3", default-features = false, features = ["core-full", "core-host", "render"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
